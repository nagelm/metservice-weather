<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Setting it up</title>
  <desc id="desc">Screen one asks for a device name, the weather location (163 towns, cities and rural spots) and an optional marine region, with an Advanced section to auto-hide seasonal sensors. If you picked a marine region, screen two lets you choose a tide station, boating location and surf spot, each of which can be skipped.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #F4F8FB; } .card { fill: #FFFFFF; stroke: #D5E0EA; } .cut { fill: #FFFFFF; }
    .ink { fill: #13273B; } .muted { fill: #58697A; } .on { fill: #FFFFFF; }
    .field { fill: none; stroke: #B9C7D4; } .chev { stroke: #58697A; }
    .arrow { stroke: #9FB1C3; } .arrowhead { fill: #9FB1C3; }
    .f-sky { fill: #3D8BD9; } .s-sky { stroke: #3D8BD9; } .t-sky { fill: #E7F1FB; }
    .f-sea { fill: #1F5F8B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0F1923; } .card { fill: #16222E; stroke: #2A3C4F; } .cut { fill: #16222E; }
      .ink { fill: #E8EFF6; } .muted { fill: #9CAFC1; }
      .field { stroke: #3D536A; } .chev { stroke: #9CAFC1; }
      .arrow { stroke: #4D6277; } .arrowhead { fill: #4D6277; }
      .f-sky { fill: #4F9BE6; } .s-sky { stroke: #4F9BE6; } .t-sky { fill: #17314A; }
      .f-sea { fill: #3F86BD; }
    }
  </style>

  <rect class="bg" width="960" height="480" rx="20"/>

  <!-- ============ Screen 1 ============ -->
  <rect class="card" x="20" y="20" width="410" height="440" rx="16" stroke-width="1.5"/>
  <text x="44" y="60" class="ink" font-size="21" font-weight="700">MetService Weather</text>
  <text x="406" y="60" class="muted" font-size="14" text-anchor="end">Step 1 of 2</text>

  <rect class="field" x="44" y="100" width="362" height="48" rx="8" stroke-width="1.5"/>
  <rect class="cut" x="54" y="92" width="92" height="16"/>
  <text x="58" y="104" class="muted" font-size="13">Device name</text>
  <text x="60" y="131" class="ink" font-size="17">Home</text>

  <rect class="field s-sky" x="44" y="168" width="362" height="48" rx="8" stroke-width="2"/>
  <rect class="cut" x="54" y="160" width="118" height="16"/>
  <text x="58" y="172" class="muted" font-size="13">Weather location</text>
  <text x="60" y="199" class="ink" font-size="17">Napier</text>
  <path class="chev" d="M376 189 L382 195 L388 189" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="236" class="muted" font-size="13">163 towns, cities and rural spots</text>

  <rect class="field" x="44" y="256" width="362" height="48" rx="8" stroke-width="1.5"/>
  <rect class="cut" x="54" y="248" width="100" height="16"/>
  <text x="58" y="260" class="muted" font-size="13">Marine Region</text>
  <text x="60" y="287" class="ink" font-size="17">Hawke Bay and Wairarapa</text>
  <path class="chev" d="M376 277 L382 283 L388 277" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="324" class="muted" font-size="13">Optional: tides, boating and surf</text>

  <rect class="field" x="44" y="344" width="362" height="44" rx="8" stroke-width="1.5"/>
  <path class="chev" d="M60 360 L66 366 L60 372" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="372" class="ink" font-size="16" font-weight="700">Advanced</text>
  <text x="160" y="372" class="muted" font-size="13">auto-hide seasonal sensors</text>

  <rect class="f-sky" x="314" y="404" width="92" height="40" rx="8"/>
  <text x="360" y="429" class="on" font-size="16" font-weight="700" text-anchor="middle">Submit</text>

  <!-- connector -->
  <text x="480" y="252" class="muted" font-size="14" text-anchor="middle">Picked a</text>
  <text x="480" y="270" class="muted" font-size="14" text-anchor="middle">marine region?</text>
  <line class="arrow" x1="442" y1="290" x2="506" y2="290" stroke-width="5" stroke-linecap="round"/>
  <path class="arrowhead" d="M504 279 L518 290 L504 301 Z"/>

  <!-- ============ Screen 2 ============ -->
  <rect class="card" x="530" y="20" width="410" height="440" rx="16" stroke-width="1.5"/>
  <text x="554" y="60" class="ink" font-size="21" font-weight="700">Marine locations</text>
  <text x="916" y="60" class="muted" font-size="14" text-anchor="end">Step 2 of 2</text>

  <rect class="field" x="554" y="100" width="362" height="48" rx="8" stroke-width="1.5"/>
  <rect class="cut" x="564" y="92" width="86" height="16"/>
  <text x="568" y="104" class="muted" font-size="13">Tide station</text>
  <text x="570" y="131" class="ink" font-size="17">Napier</text>
  <path class="chev" d="M886 121 L892 127 L898 121" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="field" x="554" y="168" width="362" height="48" rx="8" stroke-width="1.5"/>
  <rect class="cut" x="564" y="160" width="114" height="16"/>
  <text x="568" y="172" class="muted" font-size="13">Boating location</text>
  <text x="570" y="199" class="ink" font-size="17">Hawkes Bay</text>
  <path class="chev" d="M886 189 L892 195 L898 189" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect class="field" x="554" y="236" width="362" height="48" rx="8" stroke-width="1.5"/>
  <rect class="cut" x="564" y="228" width="96" height="16"/>
  <text x="568" y="240" class="muted" font-size="13">Surf location</text>
  <text x="570" y="267" class="ink" font-size="17">Ocean Beach Napier</text>
  <path class="chev" d="M886 257 L892 263 L898 257" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="554" y="318" class="muted" font-size="14">Don't need one? Pick “None — skip”.</text>

  <rect class="t-sky" x="554" y="342" width="362" height="44" rx="10"/>
  <text x="572" y="370" class="ink" font-size="14"><tspan font-weight="700">Tip:</tspan> change any of this later with ⋮ → Reconfigure.</text>

  <rect class="f-sky" x="824" y="404" width="92" height="40" rx="8"/>
  <text x="870" y="429" class="on" font-size="16" font-weight="700" text-anchor="middle">Submit</text>
</svg>
