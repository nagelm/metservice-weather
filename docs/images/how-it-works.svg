<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">How it works</title>
  <desc id="desc">The integration reads MetService's public web data (your town's forecast, severe weather warnings and the marine pages you picked) every 20 minutes, with no API key or account, and turns it into a weather entity and sensors for dashboards, automations and notifications.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #F4F8FB; } .card { fill: #FFFFFF; stroke: #D5E0EA; }
    .ink { fill: #13273B; } .muted { fill: #58697A; } .on { fill: #FFFFFF; }
    .arrow { stroke: #9FB1C3; } .arrowhead { fill: #9FB1C3; }
    .f-sky { fill: #3D8BD9; } .s-sky { stroke: #3D8BD9; } .t-sky { fill: #E7F1FB; }
    .row { fill: #F1F5F9; }
    .d-sun { fill: #E39A1E; } .d-warn { fill: #E4661B; } .d-sea { fill: #1F5F8B; }
    .d-leaf { fill: #3E9B57; } .d-moon { fill: #7868D6; } .d-rain { fill: #1E9E8F; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0F1923; } .card { fill: #16222E; stroke: #2A3C4F; }
      .ink { fill: #E8EFF6; } .muted { fill: #9CAFC1; }
      .arrow { stroke: #4D6277; } .arrowhead { fill: #4D6277; }
      .f-sky { fill: #4F9BE6; } .s-sky { stroke: #4F9BE6; } .t-sky { fill: #17314A; }
      .row { fill: #1C2B3A; }
      .d-sun { fill: #E9A63A; } .d-warn { fill: #EE7A35; } .d-sea { fill: #3F86BD; }
      .d-leaf { fill: #4DAF68; } .d-moon { fill: #8E80E6; } .d-rain { fill: #2BAE9E; }
    }
  </style>

  <rect class="bg" width="960" height="300" rx="20"/>

  <!-- MetService -->
  <rect class="card" x="20" y="20" width="300" height="260" rx="18" stroke-width="1.5"/>
  <text x="44" y="60" class="ink" font-size="22" font-weight="700">MetService</text>
  <text x="44" y="84" class="muted" font-size="16">public web data</text>
  <rect class="row" x="40" y="104" width="260" height="46" rx="12"/>
  <circle class="d-sun" cx="62" cy="127" r="7"/>
  <text x="80" y="133" class="ink" font-size="17">Your town's forecast</text>
  <rect class="row" x="40" y="160" width="260" height="46" rx="12"/>
  <circle class="d-warn" cx="62" cy="183" r="7"/>
  <text x="80" y="189" class="ink" font-size="17">Severe weather warnings</text>
  <rect class="row" x="40" y="216" width="260" height="46" rx="12"/>
  <circle class="d-sea" cx="62" cy="239" r="7"/>
  <text x="80" y="245" class="ink" font-size="17">Marine pages you picked</text>

  <!-- arrow 1 -->
  <line class="arrow" x1="330" y1="150" x2="354" y2="150" stroke-width="5" stroke-linecap="round"/>
  <path class="arrowhead" d="M352 139 L366 150 L352 161 Z"/>

  <!-- the integration -->
  <rect class="t-sky s-sky" x="376" y="36" width="208" height="228" rx="18" stroke-width="2"/>
  <text x="480" y="74" class="ink" font-size="18" font-weight="700" text-anchor="middle">This integration</text>
  <circle class="f-sky" cx="480" cy="124" r="30"/>
  <g transform="translate(480 124)" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle r="18"/><path d="M0 -10 V0 H8"/>
  </g>
  <text x="480" y="186" class="ink" font-size="20" font-weight="700" text-anchor="middle">Every 20 minutes</text>
  <text x="480" y="212" class="muted" font-size="15" text-anchor="middle">No API key.</text>
  <text x="480" y="233" class="muted" font-size="15" text-anchor="middle">No account.</text>

  <!-- arrow 2 -->
  <line class="arrow" x1="594" y1="150" x2="618" y2="150" stroke-width="5" stroke-linecap="round"/>
  <path class="arrowhead" d="M616 139 L630 150 L616 161 Z"/>

  <!-- Home Assistant -->
  <rect class="card" x="640" y="20" width="300" height="260" rx="18" stroke-width="1.5"/>
  <text x="664" y="60" class="ink" font-size="22" font-weight="700">Home Assistant</text>
  <text x="664" y="84" class="muted" font-size="16">a weather entity + sensors</text>
  <rect class="row" x="660" y="104" width="260" height="46" rx="12"/>
  <circle class="d-leaf" cx="682" cy="127" r="7"/>
  <text x="700" y="133" class="ink" font-size="17">Dashboards</text>
  <rect class="row" x="660" y="160" width="260" height="46" rx="12"/>
  <circle class="d-moon" cx="682" cy="183" r="7"/>
  <text x="700" y="189" class="ink" font-size="17">Automations</text>
  <rect class="row" x="660" y="216" width="260" height="46" rx="12"/>
  <circle class="d-rain" cx="682" cy="239" r="7"/>
  <text x="700" y="245" class="ink" font-size="17">Notifications &amp; voice</text>
</svg>
