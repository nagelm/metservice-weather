name: "Dependency review"

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  dependency-review:
    name: "Dependency review"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Review dependency changes"
        uses: "actions/dependency-review-action@v5.0.0"
