name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
      - "modernize/cleanup"
  pull_request:
    branches:
      - "main"
      - "modernize/cleanup"

permissions:
  contents: read

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master" # unpinned on purpose: read-only token, no secrets, nightly run picks up new rules

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

        - name: "Run HACS validation"
          uses: "hacs/action@main" # unpinned on purpose: read-only token, no secrets, nightly run picks up new rules
          with:
            category: "integration"
